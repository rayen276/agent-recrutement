[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "recruitment-agent"
version = "1.0.0"
description = "Agent IA RH : analyse un CV, le compare à une offre et rédige une lettre de motivation."
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.6",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
  "python-docx>=1.1",
]

[project.optional-dependencies]
web = ["streamlit>=1.40"]
anthropic = ["anthropic>=0.40.0"]
dev = ["pytest>=8.0"]

[project.scripts]
recruter = "recruitment_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
